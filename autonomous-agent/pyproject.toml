[project]
name = "autonomous-agent"
version = "0.1.0"
description = "ReAct-based autonomous task executor agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Autonomous Agent Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    
    # LLM Providers
    "openai>=1.35",
    "anthropic>=0.30",
    "httpx>=0.27",
    "tenacity>=8.2",
    
    # Tools & Utils
    "watchfiles>=0.21",
    "rich>=13.7",
    
    # Observability
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
    "opentelemetry-exporter-otlp>=1.21",
    "opentelemetry-instrumentation-httpx>=0.42",
    
    # Testing
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "black>=24.4",
]
local = [
    "ollama>=0.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH", "PD", "PL", "TRY", "SIM", "TID"]
ignore = ["S101", "PTH118", "PTH123"]
fixable = ["F", "I", "PTH", "PD", "PL", "TRY", "SIM", "TID"]
unfixable = ["S101"]
extend-per-file-ignores = [
    "tests/**/*.py = [\"S101\", \"PTH118\", \"PTH123\"]"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]